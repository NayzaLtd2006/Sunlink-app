    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }

    nav { background: #000; padding: 15px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #FFD700; text-align: center; }

      color: #000;

      font-weight: bold;
      font-size: 1.1rem;
      margin: 10px;
      display: inline-block;
      transition: 0.3s;
    }
    .btn:hover { background: #fff; transform: scale(1.05); }
    
    .app-buttons { margin-top: 20px; }
    .app-btn {
      background: #1a1a1a;
      border: 2px solid #FFD700;
      color: #FFD700;

      margin: 8px;
      display: inline-block;
      font-weight: bold;
    }
    .app-btn:hover { background: #FFD700; color: #000; }
    
    section { padding: 60px 20px; max-width: 1200px; margin: auto; }
    h2 { text-align: center; font-size: 2.5rem; color: #FFD700; margin-bottom: 20px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }
    .card {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #FFD700;
      text-align: left;
    }
    .card h3 { color: #FFD700; margin-bottom: 15px; text-align: center; }
    
    .vendor-card {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #FFD700;
      text-align: center;
    }
    .vendor-card h4 { color: #FFD700; margin-bottom: 8px; }
    .vendor-card p { font-size: 0.9rem; color: #ccc; margin-bottom: 10px; }
    .whatsapp-btn {
      background: #25D366;
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-top: 10px;
    }
    
    .vendor-form {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 15px;
      border: 2px solid #FFD700;
      max-width: 600px;
      margin: auto;
    }
    .vendor-form input, .vendor-form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0a0a0a;
      border: 1px solid #FFD700;
      color: #fff;
      border-radius: 8px;
    }
    
    .tnc {
      background: #111;
      padding: 30px;
      border-radius: 15px;
      border-left: 4px solid #FFD700;
      line-height: 1.8;
    }
    
    footer {
      background: #000;
      text-align: center;
      padding: 40px 20px;
      border-top: 2px solid #FFD700;
    }
    .social a { color: #FFD700; margin: 0 10px; text-decoration: none; }
