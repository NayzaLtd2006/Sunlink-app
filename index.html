<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunLink Hub | SLH - Sun City Hospitality</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: #0a0a0a; color: #fff; }
    
    header {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1200') center/cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    
    .logo { font-size: 3rem; font-weight: bold; color: #FFD700; margin-bottom: 10px; }
    .tagline { font-size: 1.2rem; color: #fff; margin-bottom: 30px; }
    
    .btn {
      background: #FFD700;
      color: #000;
      padding: 15px 40px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: 0.3s;
    }
    .btn:hover { background: #fff; transform: scale(1.05); }
    
    section { padding: 60px 20px; max-width: 1200px; margin: auto; }
    
    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }
    
    .card {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #FFD700;
      text-align: center;
    }
    
    .card h3 { color: #FFD700; margin-bottom: 15px; }
    
    footer {
      background: #000;
      text-align: center;
      padding: 30px 20px;
      border-top: 2px solid #FFD700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">SUNLINK HUB</div>
    <div class="tagline">SLH - Premium Hospitality & Experiences at Sun City</div>
    <a href="#services" class="btn">Explore Our Services</a>
  </header>

  <section id="services">
    <h2 style="text-align: center; font-size: 2.5rem; color: #FFD700; margin-bottom: 10px;">Our Services</h2>
    <p style="text-align: center; color: #ccc; margin-bottom: 40px;">Luxury. Comfort. Sun City Experience.</p>
    
    <div class="services">
